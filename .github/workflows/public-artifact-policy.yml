name: Public artifact policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  allowlist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject unexpected published files
        run: node scripts/check-public-artifact.mjs
